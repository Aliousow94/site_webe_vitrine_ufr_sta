{% extends "admin/base.html" %}
{% block title %}Ajouter un département{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('dashboard') }}">Tableau de bord</a> / <a href="{{ url_for('liste_departement') }}">Départements</a> / Ajouter{% endblock %}

{% block contenu %}
<div class="page-header">
    <h2>Ajouter un département</h2>
    <a href="{{ url_for('liste_departement') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Retour
    </a>
</div>

<div class="admin-card">
    <div class="card-header"><h3><i class="bi bi-plus-circle"></i> Nouveau département</h3></div>
    <div class="card-body">
        <form method="POST" class="admin-form">
            <div class="form-group">
                <label for="departement_id">Département</label>
                 <select id="departement_id" name="departement_id">
                    <option value="">-- Aucun --</option>
                    {% for d in departements %}
                    <option value="{{ d.id }}">{{ d.nom }}</option>
                    {% endfor %}
                 </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="responsable">Responsable</label>
                    <input type="text" id="responsable" name="responsable" placeholder="Ex: Dr. Lamine YADE" required>
                </div>
                <div class="form-group">
                    <label for="contact">Contact</label>
                    <input type="text" id="contact" name="contact" placeholder="Ex: info@ufrsta.sn" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="6" placeholder="Décrivez le département, ses objectifs et ses domaines d'activité..." required></textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('liste_departement') }}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-indigo">
                    <i class="bi bi-check-lg"></i> Créer le département
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
