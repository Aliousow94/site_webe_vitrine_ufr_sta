<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - UFR STA</title>
    
    <!-- Lien vers le CSS de l'admin (qui contient le design de la page de connexion) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    
    <!-- Lien pour les icones (oeil, enveloppe, etc.) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="login-page">
    
    <!-- Gestion des messages d'erreur (ex: mauvais mot de passe) -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-messages-container" style="padding: 10px; background-color: #f8d7da; color: #721c24; margin-bottom: 20px; max-width: 420px; width: 90%; border-radius: 8px;">
                <ul style="margin: 0; padding-left: 20px; list-style: none;">
                {% for message in messages %}
                    <li style="margin-bottom: 5px;">{{ message }}</li>
                {% endfor %}
                </ul>
            </div>
        {% endif %}
    {% endwith %}

    <!-- La carte de connexion -->
    <div class="login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='images/logo.webp') }}" alt="Logo UFR STA" class="login-logo">
            <h1>Espace Administration</h1>
            <p>UFR STA — UAM</p>
        </div>

        <form method="POST" class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">
                    <i class="bi bi-envelope-fill"></i> Adresse email
                </label>
                <input type="email" id="email" name="email" placeholder="admin@ufrsta.sn" required>
            </div>

            <div class="form-group">
                <label for="motdepasse">
                    <i class="bi bi-lock-fill"></i> Mot de passe
                </label>
                <div class="password-wrap">
                    <input type="password" id="motdepasse" name="motdepasse" placeholder="Votre mot de passe" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Afficher le mot de passe">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="bi bi-box-arrow-in-right"></i> Se connecter
            </button>
        </form>

        <a href="{{ url_for('index') }}" class="login-back">
            <i class="bi bi-arrow-left"></i> Retour au site
        </a>
    </div>

    <!-- Lien vers le JavaScript pour le bouton "oeil" -->
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
