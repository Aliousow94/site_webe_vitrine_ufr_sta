{% extends "admin/base.html" %}
{% block title %}Modifier le département{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('dashboard') }}">Tableau de bord</a> / <a href="{{ url_for('liste_departement') }}">Départements</a> / Modifier{% endblock %}

{% block contenu %}
<div class="page-header">
    <h2>Modifier le département</h2>
    <a href="{{ url_for('liste_departement') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Retour
    </a>
</div>

<div class="admin-card">
    <div class="card-header"><h3><i class="bi bi-pencil-square"></i> Modifier</h3></div>
    <div class="card-body">
        <form method="POST" class="admin-form">
            <div class="form-group">
                <label for="nom">Nom du département</label>
                <input type="text" id="nom" name="nom" value="{{ departement.nom }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="responsable">Responsable</label>
                    <input type="text" id="responsable" name="responsable" value="{{ departement.responsable }}" required>
                </div>
                <div class="form-group">
                    <label for="contact">Contact</label>
                    <input type="text" id="contact" name="contact" value="{{ departement.contact }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="6" required>{{ departement.description }}</textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('liste_departement') }}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Enregistrer les modifications
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
